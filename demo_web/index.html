<!DOCTYPE html><html><head><meta charset="utf-8"><title>AIVAR Demo App</title><style>body{font-family:Arial;max-width:600px;margin:50px auto}input{display:block;width:100%;padding:10px;margin:8px 0}button{padding:10px 18px;margin-top:8px}.error{color:#b00020}</style></head><body><h1>Demo Application</h1><section id="login"><h2>Login</h2><label for="username">Username</label><input id="username" name="username"><label for="password">Password</label><input id="password" name="password" type="password"><button type="button" onclick="login()">Sign In</button><div id="message"></div></section><section id="dashboard" hidden><h2>Dashboard</h2><p>Welcome to the dashboard.</p><button type="button" onclick="logout()">Logout</button></section><script>function login(){let u=username.value,p=password.value,m=message;if(!u){m.className='error';m.textContent='Username is required';return}if(!p){m.className='error';m.textContent='Password is required';return}if(u==='demo'&&p==='password'){loginSection.hidden=true;dashboard.hidden=false;return}m.className='error';m.textContent='Invalid credentials'}function logout(){dashboard.hidden=true;loginSection.hidden=false;message.textContent=''}const loginSection=document.getElementById('login'),dashboard=document.getElementById('dashboard'),username=document.getElementById('username'),password=document.getElementById('password'),message=document.getElementById('message');</script></body></html>
